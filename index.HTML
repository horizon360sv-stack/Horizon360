<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon 360 - Recorridos Virtuales</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Horizon 360 Logo">
            <span>HORIZON 360</span>
        </div>
        <nav>
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#cotizacion">Cotización</a></li>
                <li><a href="#proyectos">Proyectos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="inicio">
            <h1>Expertos en Recorridos Virtuales 360</h1>
            <p>Capturamos el mundo desde una nueva dimensión con drones de última tecnología.</p>
        </section>

        <section id="cotizacion">
            <h2>Cotiza tu Proyecto</h2>
            <form id="quote-form">
                <label for="plan">Plan Base (5 fotos 360):</label>
                <select id="plan" name="plan">
                    <option value="base">Plan Base - $XX</option>
                </select>

                <label for="extras">Fotos adicionales:</label>
                <input type="number" id="extras" name="extras" min="0" placeholder="0">

                <label for="time">Opciones de iluminación:</label>
                <select id="time" name="time">
                    <option value="day">Día</option>
                    <option value="sunrise">Amanecer (+$2)</option>
                    <option value="sunset">Atardecer (+$2)</option>
                    <option value="night">Noche (+$2)</option>
                </select>

                <p>Pago: 50% de adelanto mediante código QR.</p>
                <button type="submit">Solicitar Cotización</button>
            </form>
        </section>

        <section id="proyectos">
            <h2>Ejemplos de Proyectos</h2>
            <div class="project-grid">
                <div class="project-card">
                    <img src="proyecto1.jpg" alt="Centro Histórico">
                    <h3>Centro Histórico</h3>
                </div>
                <!-- Agrega más proyectos aquí -->
            </div>
        </section>
    </main>
</body>
</html>
